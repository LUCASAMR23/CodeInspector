<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Verificador simples de delimitadores JavaScript.">
  <title>Analisador Sintático</title>
  <link rel="stylesheet" href="style.css">
  <script src="script.js" defer></script>
</head>
<body>
  <main>
    <h1>Analisador Sintático</h1>
    <p class="descricao">Este projeto verificará parênteses, colchetes e chaves em códigos JavaScript.</p>
    <label for="codigo">Código JavaScript</label>
    <textarea id="codigo" spellcheck="false" aria-describedby="ajuda-codigo" placeholder="Escreva ou cole seu código aqui"></textarea>
    <small id="ajuda-codigo">Strings e comentários são ignorados na verificação.</small>
    <div class="acoes">
      <button id="botao-analisar" type="button">Analisar código</button>
    </div>
    <section id="painel-resultado" class="resultado neutro" aria-live="polite">
      <h2>Resultado</h2>
      <p id="resumo-resultado">Aguardando análise</p>
      <ul id="lista-erros" hidden></ul>
    </section>
    <details>
      <summary>Ver o código usado para encontrar os erros</summary>
      <pre><code id="codigo-analise"></code></pre>
    </details>
  </main>
</body>
</html>
